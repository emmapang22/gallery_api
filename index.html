<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Met Gallery</title>
    <link href="/src/tailwind.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header
      class="text-center w-full bg-red-800 flex flex-col lg:flex-row gap-2 items-center p-5 lg:relative"
    >
      <a href="/">
        <h1 class="text-white text-xl font-serif font-medium">
          The Met Gallery
        </h1></a
      >

      <form
        id="form"
        class="flex flex-col gap-2 lg:flex-row lg:items-center lg:absolute lg:left-1/2 lg:-translate-x-1/2"
      >
        <label for="searchArtwork" class="text-white font-medium">
          Search artworks:</label
        >

        <input
          type="text"
          name="text"
          id="searchArtwork"
          placeholder="ex. art by vincent van gogh"
          class="bg-white rounded text-amber-950 py-1 px-2 w-64 lg:w-80"
        />

        <button
          class="bg-red-950 text-white font-medium py-1 lg:px-2 rounded hover:cursor-pointer hover:bg-gray-100 hover:text-black"
        >
          Submit
        </button>
      </form>
    </header>

    <main id="app" class="px-4 py-6 max-w-7xl mx-auto flex justify-center">
      <section id="artSection" class="grid grid-cols-12 gap-6 gap-y-10 w-full">
        <div
          class="col-span-12 flex flex-col items-center gap-4 mt-40 lg:mt-60"
        >
          <h2
            class="text-3xl lg:text-5xl text-center font-bold text-red-950 font-serif"
          >
            Explore the art collection from The Met Museum
          </h2>
          <span class="text-7xl">🖼️ 🔍</span>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
